name: Обновление цен «Популярные направления»

on:
  schedule:
    - cron: "17 */4 * * *"   # каждые 4 часа
  workflow_dispatch: {}       # ручной запуск из вкладки Actions

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Получить цены
        env:
          TUTU_PRICES_API_URL: ${{ secrets.TUTU_PRICES_API_URL }}
          TUTU_PRICES_API_TOKEN: ${{ secrets.TUTU_PRICES_API_TOKEN }}
        run: python scripts/update_prices.py

      - name: Сохранить, если цены изменились
        run: |
          if git diff --quiet -- assets/prices.json; then
            echo "Цены не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/prices.json
          git commit -m "Обновить цены популярных направлений"
          git push
