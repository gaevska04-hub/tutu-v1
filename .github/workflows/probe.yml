name: probe
on: { push: { branches: [probe-tutu] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe.txt 2>&1
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          for u in https://avia.tutu.ru/f/Dushanbe/Moscow/ https://avia.tutu.ru/f/Moscow/Dushanbe/ https://avia.tutu.ru/f/Dushanbe/Ekaterinburg/; do
            echo "===== $u"
            curl -sS -L -m 30 -A "$UA" -H 'Accept-Language: ru-RU,ru;q=0.9' -o page.html -w 'status=%{http_code} size=%{size_download} final=%{url_effective}\n' "$u" || true
            echo "--- title:"; grep -o '<title>[^<]*' page.html | head -2
            echo "--- captcha/bot markers:"; grep -o -i 'captcha\|smartcaptcha\|qrator\|ddos-guard\|access denied\|робот' page.html | sort | uniq -c | head
            echo "--- price-like text:"; grep -o -E '(от |от&nbsp;)?[0-9]{1,3}([  \xC2\xA0]?[0-9]{3})+ ?(₽|&#8381;|руб)' page.html | sort | uniq -c | sort -rn | head -15
            echo "--- json keys:"; grep -o -E '"(minPrice|min_price|price|priceValue|amount|lowPrice|offers)"[^,}]{0,40}' page.html | head -15
            echo "--- scripts with data:"; grep -o -E '<script[^>]*(application/(ld\+)?json|__NEXT_DATA__|__INITIAL_STATE__)[^>]*>' page.html | head -5
            grep -o -E 'window\.__[A-Z_]+__' page.html | sort -u | head
            sleep 3
          done
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f probe.txt; git commit -m result; git push
