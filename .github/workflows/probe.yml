name: probe
on: { push: { branches: [probe-tutu] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe.txt 2>&1
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          get(){ curl -sS -L -m 30 -A "$UA" -H 'Accept-Language: ru-RU,ru;q=0.9' -o page.html -w '%{http_code}' "$1"; }
          echo "### links on Dushanbe-Ekaterinburg page"
          get https://avia.tutu.ru/f/Dushanbe/Ekaterinburg/ >/dev/null
          grep -o 'href="[^"]*/f/[^"]*"' page.html | sort -u | grep -i 'mosk\|mosc\|peter\|hud\|khu\|hoj\|khoj\|dush' | head -40
          echo "### ld+json product"
          python3 - <<'PY'
          import re
          s=open('page.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<script type="application/ld\+json"[^>]*>(.*?)</script>',s,re.S): print(m.group(1)[:700]); print('---')
          PY
          echo "### candidates"
          for path in Dushanbe/Moskva Dushanbe/Moscow-Russia Moskva/Dushanbe Dushanbe/Sankt-Peterburg Hudzhand/Sankt-Peterburg Khudzhand/Sankt-Peterburg Khujand/Sankt-Peterburg Hudzhand/Moskva Khudzhand/Moskva Moskva/Hudzhand Moskva/Khudzhand Sankt-Peterburg/Dushanbe Samara/Dushanbe; do
            code=$(get "https://avia.tutu.ru/f/$path/")
            echo "$code $path :: $(grep -o '<title>[^<]*' page.html | head -1)"
            sleep 2
          done
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f probe.txt; git commit -m result; git push
